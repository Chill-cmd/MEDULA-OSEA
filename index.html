<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio de Fisiología Hematopoyética</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#090c10; --bg-1:#0f141b; --bg-2:#161c25; --bg-3:#1e2632;
  --border:#2a3341; --border-soft:#1c2430;
  --text:#e7ecf2; --text-dim:#9aa7b8; --text-faint:#5f6b7d;
  --accent:#35c7ff; --accent-dim:#123544;
  --marrow:#d9a441; --marrow-red:#e0505a; --cartilage:#5fa8c9;
  --wbc:#5b8def; --mono-c:#f2994a; --immune:#b083f0;
  --good:#3ecf8e; --bad:#e0505a; --warn:#f2c14e;
  --font-display:'Archivo','Arial Black',sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono','Courier New',monospace;
  --radius:10px; --radius-lg:18px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance; margin:0 0 8px;}
p{margin:0 0 10px; max-width:65ch;}
a{color:var(--accent);}
button{font-family:var(--font-body); cursor:pointer;}
::selection{background:var(--accent); color:#04121a;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
  display:flex; align-items:center; gap:16px; justify-content:space-between;
  padding:12px 20px; background:rgba(9,12,16,.92); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);
}
.brand{background:none; border:none; color:var(--text); font-family:var(--font-display); font-weight:900; font-size:14px; letter-spacing:.04em; display:flex; align-items:center; gap:8px; padding:6px 0;}
.brand .dot{color:var(--accent);}
.crumb{font-family:var(--font-mono); font-size:12px; color:var(--text-dim); letter-spacing:.05em; text-transform:uppercase; flex:1; text-align:center;}
.readout{font-family:var(--font-mono); font-size:11px; color:var(--good); letter-spacing:.05em; display:flex; align-items:center; gap:6px;}
.readout .led{width:6px; height:6px; border-radius:50%; background:var(--good); box-shadow:0 0 6px var(--good);}
@media (max-width:720px){ .crumb{display:none;} }

main#app{max-width:1180px; margin:0 auto; padding:24px 20px 64px;}

.btn{
  border:1px solid var(--border); background:var(--bg-2); color:var(--text);
  border-radius:8px; padding:10px 16px; font-size:13px; font-weight:600;
  display:inline-flex; align-items:center; gap:8px; transition:border-color .15s, transform .1s, background .15s;
}
.btn:hover{border-color:var(--accent); background:var(--bg-3);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.35; cursor:not-allowed;}
.btn.primary{background:var(--accent); color:#04121a; border-color:var(--accent);}
.btn.primary:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent;}
.btn.sm{padding:6px 12px; font-size:12px;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

.hero{display:grid; grid-template-columns:1.1fr .9fr; gap:40px; align-items:center; padding:20px 0 40px;}
@media (max-width:820px){ .hero{grid-template-columns:1fr;} }
.eyebrow{font-family:var(--font-mono); color:var(--accent); font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px;}
.hero h1{font-size:clamp(28px,5vw,44px); line-height:1.05;}
.hero .sub{color:var(--text-dim); font-size:16px; max-width:52ch;}
.skeleton-wrap{display:flex; justify-content:center;}
.skeleton-wrap svg{width:100%; max-width:260px; filter:drop-shadow(0 0 24px rgba(53,199,255,.08));}

.module-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; margin-top:8px;}
.mod-card{
  text-align:left; background:var(--bg-1); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:18px; display:flex; flex-direction:column; gap:10px; transition:border-color .15s, transform .12s, background .15s;
}
.mod-card:hover{border-color:var(--accent-c,var(--accent)); background:var(--bg-2); transform:translateY(-2px);}
.mod-card .num{font-family:var(--font-mono); font-size:11px; color:var(--text-faint);}
.mod-card .icon{width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:8px; background:var(--bg-3); color:var(--accent-c,var(--accent));}
.mod-card h3{font-size:16px; margin:0;}
.mod-card p{font-size:12.5px; color:var(--text-dim); margin:0;}

.module-header{margin-bottom:20px;}
.module-header .kicker{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint);}
.module-header h1{font-size:clamp(22px,4vw,32px); margin:2px 0 6px;}

.disclaimer{
  display:flex; gap:10px; align-items:flex-start; background:var(--bg-1); border:1px solid var(--border-soft);
  border-left:3px solid var(--warn); border-radius:8px; padding:12px 14px; font-size:12.5px; color:var(--text-dim); margin-bottom:20px;
}
.disclaimer b{color:var(--warn); font-weight:600;}

.tabs{display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--border); margin-bottom:22px; padding-bottom:0;}
.tab{background:none; border:none; color:var(--text-dim); font-size:13px; font-weight:600; padding:10px 14px; border-bottom:2px solid transparent; font-family:var(--font-body);}
.tab.active{color:var(--text); border-color:var(--accent);}
.tab:hover{color:var(--text);}

.panel{background:var(--bg-1); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px;}
.panel + .panel{margin-top:16px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:720px){ .grid-2,.grid-3{grid-template-columns:1fr;} }

.chip{display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:11px; padding:3px 9px; border-radius:20px; background:var(--bg-3); color:var(--text-dim); border:1px solid var(--border);}
.chip.source{color:var(--accent);border-color:var(--accent-dim);}
.chip.cd4{color:var(--wbc); border-color:var(--wbc);}
.chip.cd8{color:var(--marrow-red); border-color:var(--marrow-red);}

.pbar{height:8px; border-radius:6px; background:var(--bg-3); overflow:hidden; border:1px solid var(--border-soft);}
.pbar-fill{height:100%; border-radius:6px; transition:width .5s ease;}
.stat-row{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em;}

.compare-box{border:1px solid var(--border); border-radius:12px; padding:16px; background:var(--bg-2);}
.compare-box h4{font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.swatch{width:11px; height:11px; border-radius:3px; display:inline-block;}

.slider-block{margin:18px 0;}
.slider-block label{display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); margin-bottom:8px; font-family:var(--font-mono);}
input[type=range]{width:100%; accent-color:var(--accent); height:4px;}
.age-ticks{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:10px; color:var(--text-faint); margin-top:6px;}

.stepper-shell{display:flex; flex-direction:column; align-items:center; gap:18px;}
.stage-dots{display:flex; gap:6px; flex-wrap:wrap; justify-content:center;}
.dot{width:9px; height:9px; border-radius:50%; background:var(--bg-3); border:1px solid var(--border);}
.dot.active{background:var(--accent); border-color:var(--accent);}
.dot.done{background:var(--text-faint);}
.stepper-controls{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.stage-caption{text-align:center; max-width:520px;}
.stage-caption h3{margin-bottom:4px;}
.stage-caption p{color:var(--text-dim); font-size:13px; margin:0 auto;}

.cell-canvas{display:flex; align-items:center; justify-content:center; min-height:220px;}

.why-box{background:var(--bg-2); border:1px dashed var(--border); border-radius:10px; padding:14px; margin-top:14px; font-size:13px; color:var(--text-dim); display:none;}
.why-box.open{display:block;}

.select-grid{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
.pill{background:var(--bg-2); border:1px solid var(--border); border-radius:30px; padding:9px 16px; font-size:13px; font-weight:600; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
.pill.active{color:#04121a; border-color:transparent;}
.pill .swatch-dot{width:9px; height:9px; border-radius:50%;}

.vessel{position:relative; background:linear-gradient(180deg,#0c1620,#0a0f16); border:1px solid var(--border); border-radius:14px; padding:26px 20px; overflow:hidden;}
.vessel-lane{position:relative; height:120px; border-top:2px dotted var(--border); border-bottom:2px dotted var(--border); margin:20px 0;}
.endo-cell{position:absolute; bottom:0; width:34px; height:16px; background:var(--bg-3); border:1px solid var(--border); border-radius:3px 3px 0 0;}
.leuko-token{position:absolute; width:26px; height:26px; border-radius:50%; background:var(--wbc); box-shadow:0 0 14px rgba(91,141,239,.5); transition:left 1s cubic-bezier(.4,0,.2,1), top .8s ease, transform .6s ease; display:flex; align-items:center; justify-content:center; font-size:12px;}

.mhc-drop{display:flex; gap:16px; margin-top:16px; flex-wrap:wrap;}
.mhc-target{flex:1; min-width:180px; border:2px dashed var(--border); border-radius:12px; padding:20px; text-align:center; background:var(--bg-2);}
.mhc-target h4{margin-bottom:4px;}
.mhc-target.correct{border-color:var(--good); background:rgba(62,207,142,.08);}
.mhc-target.wrong{border-color:var(--bad); background:rgba(224,80,90,.08);}

.quiz-card{max-width:640px; margin:0 auto;}
.quiz-stem{font-size:16px; font-weight:600; margin-bottom:18px;}
.option{display:block; width:100%; text-align:left; background:var(--bg-2); border:1px solid var(--border); border-radius:10px; padding:12px 16px; margin-bottom:10px; font-size:14px; color:var(--text);}
.option:hover:not(:disabled){border-color:var(--accent);}
.option.correct{border-color:var(--good); background:rgba(62,207,142,.1); color:var(--good);}
.option.wrong{border-color:var(--bad); background:rgba(224,80,90,.1); color:var(--bad);}
.option:disabled{cursor:default;}
.explain{background:var(--bg-2); border-left:3px solid var(--accent); border-radius:8px; padding:12px 14px; font-size:13px; color:var(--text-dim); margin-top:14px; display:none;}
.explain.open{display:block;}
.quiz-meta{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--text-faint); margin-bottom:10px; text-transform:uppercase;}
.progressline{height:4px; background:var(--bg-3); border-radius:2px; margin-bottom:24px; overflow:hidden;}
.progressline-fill{height:100%; background:var(--accent);}

.result-hero{text-align:center; padding:30px 0;}
.result-score{font-family:var(--font-display); font-size:56px; font-weight:900; color:var(--accent);}
.review-row{display:flex; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--border-soft); font-size:13px;}

.order-pool{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
.order-slots{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; min-height:44px; padding:8px; border:1px dashed var(--border); border-radius:10px;}
.order-chip{background:var(--bg-3); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600;}

table.comp-table{width:100%; border-collapse:collapse; font-size:13px;}
table.comp-table td,table.comp-table th{padding:8px 6px; border-bottom:1px solid var(--border-soft); text-align:left;}
table.comp-table th{color:var(--text-faint); font-family:var(--font-mono); font-size:11px; text-transform:uppercase;}

.side-note{font-size:12px; color:var(--text-faint); margin-top:10px;}
.flow-diagram{display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; padding:20px 0;}
.flow-node{background:var(--bg-2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:12.5px; font-weight:600; text-align:center;}
.flow-node.hot{border-color:var(--accent); box-shadow:0 0 14px rgba(53,199,255,.25);}
.flow-arrow{color:var(--text-faint); font-size:18px;}

footer.appfoot{text-align:center; color:var(--text-faint); font-size:11.5px; font-family:var(--font-mono); padding:30px 20px 50px;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="brand" id="btnHome" onclick="navigate('home')"><span class="dot">&#9673;</span> LABORATORIO DE FISIOLOGÍA HEMATOPOYÉTICA</button>
  <div class="crumb" id="crumb">Inicio</div>
  <div class="readout"><span class="led"></span> SISTEMA LISTO</div>
</header>
<main id="app"></main>
<footer class="appfoot">Simulador educativo &middot; no es una herramienta diagnóstica &middot; Medicina &middot; hecho para el recall activo</footer>
<script>
/* === DATA_START === */
const SRC_MRI = "Londoño MA, Vallejo JM, Manzano AC. Rev Colomb Radiol. 2015;26(2):4206-12";

const MARROW_COMPOSITION = {
  red:{
    name:"Médula ósea roja", cellPct:60, fatCellPct:40,

  T1:{

    red:{gray:"#5c5c5c", desc:"Señal intermedia-baja por su alto contenido celular y de agua, aunque suele ser más brillante que el músculo o los discos intervertebrales."},

    why:"STIR (Short TI Inversion Recovery) usa un pulso de inversión programado para anular la señal de la grasa. Con la grasa suprimida, la médula roja puede verse relativamente brillante — este hallazgo normal no debe confundirse con el realce por contraste de una secuencia T1 con gadolinio, que es un fenómeno completamente distinto."
  }
};

const AGE_STAGES = [
  {
    id:"fetal", label:"Fetal",
    text:"Las diáfisis y metáfisis de los huesos largos muestran señal T1 baja porque predomina la médula roja. Las epífisis aún no osificadas son cartilaginosas y muestran señal T1 intermedia por su alto contenido de agua.",
    regions:{skull:"cartilage", spine:"red", chest:"red", pelvis:"red", humProxL:"red", humProxR:"red", humDiaL:"red", humDiaR:"red", femProxL:"red", femProxR:"red", femDiaL:"red", femDiaR:"red", handL:"cartilage", handR:"cartilage", footL:"cartilage", footR:"cartilage"}
  },
  {

    text:"Cuando las epífisis comienzan a osificarse, aparece médula grasa en los nuevos centros de osificación como focos de señal alta en T1. Las falanges y metatarsianos mantienen señal alta en T2 por el abundante contenido de agua del cartílago.",
    regions:{skull:"red", spine:"red", chest:"red", pelvis:"red", humProxL:"redyellow", humProxR:"redyellow", humDiaL:"red", humDiaR:"red", femProxL:"redyellow", femProxR:"redyellow", femDiaL:"red", femDiaR:"red", handL:"red", handR:"red", footL:"red", footR:"red"}
  },
  {
    id:"y1", label:"1 año",

    regions:{skull:"red", spine:"red", chest:"red", pelvis:"red", humProxL:"red", humProxR:"red", humDiaL:"redyellow", humDiaR:"redyellow", femProxL:"red", femProxR:"red", femDiaL:"redyellow", femDiaR:"redyellow", handL:"yellow", handR:"yellow", footL:"yellow", footR:"yellow"}
  },
  {

    regions:{skull:"yellow", spine:"red", chest:"red", pelvis:"red", humProxL:"red", humProxR:"red", humDiaL:"yellow", humDiaR:"yellow", femProxL:"red", femProxR:"red", femDiaL:"yellow", femDiaR:"yellow", handL:"yellow", handR:"yellow", footL:"yellow", footR:"yellow"}

  {

    regions:{skull:"yellow", spine:"redyellow", chest:"red", pelvis:"red", humProxL:"redyellow", humProxR:"redyellow", humDiaL:"yellow", humDiaR:"yellow", femProxL:"redyellow", femProxR:"redyellow", femDiaL:"yellow", femDiaR:"yellow", handL:"yellow", handR:"yellow", footL:"yellow", footR:"yellow"}
  },
  {
    id:"adult", label:"25+ años (Adulto)",

  }
];
const REGION_COLOR = {red:"var(--marrow-red)", yellow:"var(--marrow)", redyellow:"#c77a5a", cartilage:"var(--cartilage)"};

const HEMATO_TREE = {
  id:"hsc", name:"Célula Madre Hematopoyética",
  info:{origin:"Reside en el nicho hematopoyético de la médula ósea roja, anclada a células del estroma y al endotelio sinusoidal.", function:"Pluripotente y autorrenovable; da origen a todos los linajes de células sanguíneas.", location:"Médula ósea roja (esqueleto axial y huesos largos proximales en el adulto).", characteristics:"Poco frecuente, en su mayoría quiescente, con baja tasa mitótica; la división asimétrica mantiene la reserva de células madre.", fate:"Se diferencia en progenitores mieloides o linfoides bajo la señalización de citocinas (SCF, IL-3, TPO, entre otras)."},
  children:[
    {id:"myeloid", name:"Progenitor Mieloide", branch:"myeloid",
      info:{origin:"Deriva de la célula madre hematopoyética (progenitor mieloide común / CFU-GEMM).", function:"Se compromete hacia los destinos eritroide, granulocítico, monocítico y megacariocítico.", location:"Médula ósea roja.", characteristics:"Responde a SCF, IL-3 y GM-CSF.", fate:"Se ramifica en las líneas eritroide, granulocito/monocito y megacariocito."},
      children:[

function eryCellSVG(stage){
  const d = stage.size, nd = stage.nucleus, cyto = stage.cyto;
  const cx=90, cy=90;
  let nucleusSVG = '';
  if(nd>0){
    let nucFill = '#2a3341';
    if(stage.chroma==='fine') nucFill='#3b4a63';
    if(stage.chroma==='coarser') nucFill='#2f3d54';
    if(stage.chroma==='clumped') nucFill='#242f42';
    if(stage.chroma==='pyknotic') nucFill='#12181f';
    nucleusSVG = '<circle cx="'+cx+'" cy="'+cy+'" r="'+nd+'" fill="'+nucFill+'" stroke="#0a0d12" stroke-width="2"/>';
  } else if(stage.id==='retic'){
    nucleusSVG = '<g opacity="0.5">'+Array.from({length:8}).map((_,i)=>{
      const a = i/8*Math.PI*2, x1=cx+Math.cos(a)*6, y1=cy+Math.sin(a)*6, x2=cx+Math.cos(a)*(d*0.5), y2=cy+Math.sin(a)*(d*0.5);
      return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#0a0d12" stroke-width="1"/>';
    }).join('')+'</g>';
  }
  const dip = nd>0 ? Math.max(6, d*0.18) : d*0.28;
  return '<svg viewBox="0 0 180 180" width="200" height="200">'
    + '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+d+'" ry="'+d+'" fill="'+cyto+'" stroke="#0a0d12" stroke-width="2"/>'
    + (nd===0 && stage.id==='mature' ? '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+dip+'" ry="'+dip+'" fill="'+cyto+'" opacity="0.55"/>' : '')
    + nucleusSVG
    + '</svg>';
}

function mountStepper(container, stages, renderFn, opts){
  opts = opts || {};
  const dur = opts.interval || 2200;
  let idx = 0, playing = false, timer = null;
  const dotsHTML = stages.map((s,i)=>'<div class="dot" data-i="'+i+'"></div>').join('');
  container.innerHTML =
    '<div class="stepper-shell">'
    + '<div class="cell-canvas" id="stCanvas"></div>'
    + '<div class="stage-caption" id="stCaption"></div>'
    + '<div class="stage-dots">'+dotsHTML+'</div>'
    + '<div class="stepper-controls">'
    +   '<button class="btn sm" id="stBack">&larr; ATRÁS</button>'
    +   '<button class="btn sm primary" id="stPlay">&#9654; REPRODUCIR</button>'
    +   '<button class="btn sm" id="stNext">SIGUIENTE &rarr;</button>'
    +   '<button class="btn sm ghost" id="stReset">REINICIAR</button>'
    + '</div></div>';
  const dots = container.querySelectorAll('.dot');
  const playBtn = container.querySelector('#stPlay');
  const backBtn = container.querySelector('#stBack');
  const nextBtn = container.querySelector('#stNext');
  function stop(){ playing=false; clearInterval(timer); timer=null; playBtn.innerHTML='&#9654; REPRODUCIR'; }
  function show(i){
    if(!container.isConnected){ stop(); return; }
    idx = Math.max(0, Math.min(stages.length-1, i));
    renderFn(stages[idx], idx, stages.length);
    dots.forEach((d,di)=>{ d.classList.toggle('active', di===idx); d.classList.toggle('done', di<idx); });
    backBtn.disabled = idx===0;
    nextBtn.disabled = idx===stages.length-1;
    if(idx===stages.length-1) stop();
  }
  function play(){
    if(idx>=stages.length-1) idx=-1;
    playing = true; playBtn.innerHTML = '&#10074;&#10074; PAUSA';
    timer = setInterval(()=>{
      if(!container.isConnected){ stop(); return; }
      if(idx < stages.length-1) show(idx+1); else stop();
    }, dur);
    show(idx+1);
  }
  playBtn.onclick = ()=>{ playing ? stop() : play(); };
  backBtn.onclick = ()=>{ stop(); show(idx-1); };
  nextBtn.onclick = ()=>{ stop(); show(idx+1); };
  container.querySelector('#stReset').onclick = ()=>{ stop(); show(0); };
  dots.forEach(d=>d.onclick=()=>{ stop(); show(+d.dataset.i); });
  show(0);
}

function o2sat(po2, p50){
  const n = 2.7;
  return 100 * Math.pow(po2,n) / (Math.pow(p50,n) + Math.pow(po2,n));
}
function drawO2Curve(svgEl, po2Marker, p50, baseP50){
  const W=300,H=210, x0=36,x1=286, y0=176,y1=18;
  const toX = po2 => x0 + (po2/100)*(x1-x0);
  const toY = sat => y0 + (sat/100)*(y1-y0);
  let path = '';
  for(let po2=0; po2<=100; po2+=2){
    const sat = o2sat(po2, p50);
    path += (po2===0?'M':'L') + toX(po2).toFixed(1)+' '+toY(sat).toFixed(1)+' ';
  }
  let basePath = '';
  for(let po2=0; po2<=100; po2+=4){
    const sat = o2sat(po2, baseP50);
    basePath += (po2===0?'M':'L') + toX(po2).toFixed(1)+' '+toY(sat).toFixed(1)+' ';
  }
  const markerSat = o2sat(po2Marker, p50);
  svgEl.innerHTML =
    '<line x1="'+x0+'" y1="'+y0+'" x2="'+x1+'" y2="'+y0+'" stroke="var(--border)" stroke-width="1"/>'
  + '<line x1="'+x0+'" y1="'+y0+'" x2="'+x0+'" y2="'+y1+'" stroke="var(--border)" stroke-width="1"/>'
  + '<text x="'+((x0+x1)/2)+'" y="204" fill="var(--text-faint)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">PO2 (mmHg)</text>'
  + '<text x="14" y="'+((y0+y1)/2)+'" fill="var(--text-faint)" font-size="10" font-family="var(--font-mono)" text-anchor="middle" transform="rotate(-90 14 '+((y0+y1)/2)+')">SaO2 (%)</text>'
  + '<path d="'+basePath+'" fill="none" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="4 3"/>'
  + '<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5"/>'
  + '<line x1="'+toX(po2Marker)+'" y1="'+y0+'" x2="'+toX(po2Marker)+'" y2="'+toY(markerSat)+'" stroke="var(--marrow-red)" stroke-width="1" stroke-dasharray="3 3"/>'
  + '<circle cx="'+toX(po2Marker)+'" cy="'+toY(markerSat)+'" r="5" fill="var(--marrow-red)" stroke="#04121a" stroke-width="1.5"/>';
  return markerSat;
}

function findNode(id, node){ node = node || HEMATO_TREE; if(node.id===id) return node; if(node.children){ for(const c of node.children){ const f=findNode(id,c); if(f) return f; } } return null; }
function infoPanelHTML(node){
  const sections=['origin','function','location','characteristics','fate'];
  const labels={origin:'Origen',function:'Función',location:'Ubicación',characteristics:'Características',fate:'Destino'};
  return '<div class="panel"><h3>'+node.name+'</h3>'
    + sections.map(k=>'<details style="margin-bottom:8px;border:1px solid var(--border);border-radius:8px;padding:8px 12px;background:var(--bg-2);"><summary style="cursor:pointer;font-weight:600;font-size:13px;">'+labels[k]+'</summary><p style="margin-top:8px;">'+node.info[k]+'</p></details>').join('')
    + '</div>';
}
function renderHemato(root){

  function paint(){
    root.innerHTML = moduleHeader('Módulo 02 &middot; Hematopoyesis','Árbol de Linaje de la Célula Madre Hematopoyética')
      + '<p style="color:var(--text-dim);max-width:70ch;">Haz clic en cualquier célula para revelar su origen, función, ubicación, características y destino &mdash; una sección a la vez.</p>'
      + '<div class="panel" style="margin-bottom:16px;">'
      + '<div style="display:flex;justify-content:center;margin-bottom:6px;"><button class="btn primary tree-node" data-id="hsc">'+HEMATO_TREE.name+'</button></div>'
      + '<div style="text-align:center;color:var(--text-faint);font-size:20px;margin:2px 0 14px;">&darr;</div>'
      + '<div class="grid-2">'
      + HEMATO_TREE.children.map(branch=>
          '<div style="text-align:center;"><button class="btn tree-node" data-id="'+branch.id+'" style="width:100%;border-color:'+(branch.branch==='myeloid'?'var(--marrow-red)':'var(--immune)')+';">'+branch.name+'</button>'
          + '<div class="btn-row" style="margin-top:12px;justify-content:center;">'+branch.children.map(c=>'<button class="btn sm tree-node" data-id="'+c.id+'" style="border-color:'+(branch.branch==='myeloid'?'var(--marrow-red)':'var(--immune)')+';">'+c.name+'</button>').join('')+'</div></div>'
        ).join('')
      + '</div></div>'
      + '<div id="hematoInfo"></div>';
    root.querySelectorAll('.tree-node').forEach(b=>b.onclick=()=>{ selected=b.dataset.id; paintInfo(); mark(); });

  function mark(){ root.querySelectorAll('.tree-node').forEach(b=>{ b.style.boxShadow = b.dataset.id===selected ? '0 0 0 2px var(--accent)' : 'none'; }); }
  function paintInfo(){ const node = findNode(selected); root.querySelector('#hematoInfo').innerHTML = node ? infoPanelHTML(node) : ''; }
  paint();
}

function flowNode(label,hot){ return '<div class="flow-node'+(hot?' hot':'')+'">'+label+'</div>'; }
function flowArrow(){ return '<div class="flow-arrow">&rarr;</div>'; }
function pillToggle(id,label){ return '<button class="pill" data-flag="'+id+'" data-state="normal">'+label+': NORMAL</button>'; }

function renderEryth(root){
  root.innerHTML = moduleHeader('Módulo 03 &middot; Eritropoyesis','De la Célula Madre al Eritrocito')
    + '<div class="panel"><div class="grid-2"><div id="eryStepperMount"></div><div><div id="eryReadouts"></div></div></div></div>'
    + '<div class="panel" style="margin-top:16px;">'
    +   '<h3>Simulador de Retroalimentación de EPO</h3>'
    +   '<p class="side-note" style="margin-top:-6px;">Modelo educativo &mdash; no es un simulador de dosificación terapéutica.</p>'
    +   '<div class="grid-2">'
    +     '<div>'
    +       '<div class="slider-block"><label><span>OXÍGENO TISULAR</span><span id="o2Val">95%</span></label><input type="range" id="o2Slider" min="50" max="100" value="95"></div>'
    +       '<div class="slider-block"><label><span>FUNCIÓN RENAL</span><span id="renalVal">100%</span></label><input type="range" id="renalSlider" min="10" max="100" value="100"></div>'
    +       '<div class="select-grid">'+pillToggle('iron','HIERRO')+pillToggle('b12','VITAMINA B12')+pillToggle('folate','FOLATO')+'</div>'
    +     '</div>'
    +     '<div><div id="epoFlow"></div><div id="epoNotes" style="font-size:12.5px;color:var(--text-dim);margin-top:8px;"></div></div>'
    +   '</div>'
    + '</div>';

  mountStepper(root.querySelector('#eryStepperMount'), ERY_STAGES, (s,i,n)=>{
    root.querySelector('#stCanvas').innerHTML = eryCellSVG(s);
    root.querySelector('#stCaption').innerHTML = '<h3>'+(i+1)+'/'+n+'. '+s.name+'</h3><p>'+s.desc+'</p>';
    root.querySelector('#eryReadouts').innerHTML =
      '<div class="stat-row"><span>Tamaño celular relativo</span></div>'+pbar(Math.round(s.size/70*100),'var(--accent)')
    + '<div class="stat-row" style="margin-top:12px;"><span>Condensación nuclear</span><span>'+(s.nucleus>0?Math.round((70-s.nucleus)/70*100)+'%':'Enucleado')+'</span></div>'+pbar(s.nucleus>0?Math.round((70-s.nucleus)/70*100):100,'var(--immune)')
    + '<div class="stat-row" style="margin-top:12px;"><span>Contenido de hemoglobina</span><span>'+s.hb+'%</span></div>'+pbar(s.hb,'var(--marrow-red)');
  });

  const o2Slider=root.querySelector('#o2Slider'), renalSlider=root.querySelector('#renalSlider');
  const flags={iron:'normal', b12:'normal', folate:'normal'};
  function recompute(){
    root.querySelector('#o2Val').textContent = o2Slider.value+'%';
    root.querySelector('#renalVal').textContent = renalSlider.value+'%';
    const o2=+o2Slider.value, renal=+renalSlider.value;
    const hypoxicDrive = (100-o2);
    const epoLevel = Math.max(5, Math.round((20 + hypoxicDrive*2.4) * (renal/100)));
    const hot = epoLevel > 45;
    root.querySelector('#epoFlow').innerHTML = '<div class="flow-diagram">'
      + flowNode('Riñón', renal<60) + flowArrow()
      + flowNode('EPO &asymp; '+epoLevel, hot) + flowArrow()
      + flowNode('Estímulo eritroide', hot) + flowArrow()
      + flowNode('Reticulocitos', hot) + flowArrow()
      + flowNode('Eritrocitos', hot)
      + '</div>';
    let notes=[];
    if(renal<60) notes.push('La función renal reducida limita la capacidad de síntesis de EPO, atenuando la respuesta incluso bajo hipoxia (anemia de la enfermedad renal crónica).');
    if(flags.iron==='low') notes.push('La deficiencia de hierro limita la síntesis de hemoglobina a pesar de un estímulo eritroide adecuado.');
    if(flags.b12==='low' || flags.folate==='low') notes.push('La deficiencia de B12/folato altera la síntesis de ADN durante la maduración, produciendo precursores grandes de aspecto inmaduro (patrón megaloblástico).');
    if(o2<75) notes.push('La hipoxia tisular está impulsando un aumento en la síntesis de EPO vía la vía renal de HIF.');
    root.querySelector('#epoNotes').innerHTML = notes.map(n=>'<p>&bull; '+n+'</p>').join('') || '<p>Estado basal &mdash; no se detecta un estímulo significativo.</p>';
  }
  o2Slider.oninput = recompute; renalSlider.oninput = recompute;
  root.querySelectorAll('[data-flag]').forEach(btn=>{
    btn.onclick = ()=>{
      const id=btn.dataset.flag; flags[id] = flags[id]==='normal'?'low':'normal';
      const stateLabel = flags[id]==='low' ? 'BAJO' : 'NORMAL';
      btn.dataset.state = flags[id]; btn.textContent = btn.textContent.split(':')[0]+': '+stateLabel;
      btn.classList.toggle('active', flags[id]==='low');
      if(flags[id]==='low'){ btn.style.background='var(--warn)'; btn.style.color='#04121a'; btn.style.borderColor='var(--warn)'; }
      else { btn.style.background=''; btn.style.color=''; btn.style.borderColor=''; }
      recompute();
    };
  });
  recompute();
}

function paintOxygenTab(body){

    +   '<p class="side-note">Curva punteada = basal (pH 7.40, PCO2 40). Curva sólida = condiciones actuales. Esquema simplificado con fines didácticos, no es una medición de un paciente real.</p>'

    + '</div></div>';
  const svg=body.querySelector('#o2svg'), po2S=body.querySelector('#po2Slider'), phS=body.querySelector('#phSlider'), co2S=body.querySelector('#co2Slider');
  function recompute(){
    const po2=+po2S.value, ph=(+phS.value)/100, co2=+co2S.value;
    body.querySelector('#po2Val').textContent=po2;

function wireOrderCase(c, body, nextCase){
  let pool = shuffle(c.items.map((label,i)=>({label,i})));
  let slots = [];
  function render(){
    body.querySelector('#orderPool').innerHTML = pool.map(p=>'<button class="order-chip" data-i="'+p.i+'">'+p.label+'</button>').join('') || '<span class="side-note">&mdash;</span>';
    body.querySelector('#orderSlots').innerHTML = slots.length ? slots.map((p,si)=>'<button class="order-chip" data-i="'+p.i+'" style="border-color:var(--accent);">'+(si+1)+'. '+p.label+'</button>').join('') : '<span class="side-note">Haz clic en los pasos de arriba para colocarlos aquí.</span>';
    body.querySelectorAll('#orderPool .order-chip').forEach(b=>b.onclick=()=>{
      const idx=+b.dataset.i, item=pool.find(p=>p.i===idx);
      pool=pool.filter(p=>p.i!==idx); slots.push(item); render();
    });
    body.querySelectorAll('#orderSlots .order-chip').forEach(b=>b.onclick=()=>{
      const idx=+b.dataset.i, item=slots.find(p=>p.i===idx);
      slots=slots.filter(p=>p.i!==idx); pool.push(item); render();
    });
  }
  render();
  body.querySelector('#orderCheck').onclick=()=>{
    const order = slots.map(p=>p.i);
    const correct = order.length===c.correctOrder.length && order.every((v,idx)=>v===c.correctOrder[idx]);
    const ex = body.querySelector('#orderExplain');
    ex.classList.add('open'); ex.style.borderColor = correct ? 'var(--good)' : 'var(--bad)';
    body.querySelector('#caseNext').style.display='inline-flex';
  };
  body.querySelector('#orderReset').onclick=()=>{
    pool = shuffle(c.items.map((label,i)=>({label,i}))); slots=[]; render();
    body.querySelector('#orderExplain').classList.remove('open');
    body.querySelector('#caseNext').style.display='none';
  };
  body.querySelector('#caseNext').onclick = nextCase;
}

      + '<div class="btn-row" style="margin-bottom:20px;">'
      +   '<button class="btn '+(mode==='practice'?'primary':'')+'" id="modePractice">PRÁCTICA (PONTE A PRUEBA)</button>'
      +   '<button class="btn '+(mode==='exam'?'primary':'')+'" id="modeExam">MODO EXAMEN (18 PREGUNTAS)</button>'
      + '</div><div id="quizArea"></div>';
    root.querySelector('#modePractice').onclick=()=>{ mode='practice'; paint(); };
    root.querySelector('#modeExam').onclick=()=>{ mode='exam'; paint(); };
    if(mode==='practice') startPractice(); else startExam();
  }
  function pickPracticeQuestion(){
    let pool = QUESTION_BANK.filter(q=>!usedRecently.includes(q));
    if(pool.length===0){ usedRecently=[]; pool=QUESTION_BANK.slice(); }
    const missedTags = Object.keys(missed).filter(t=>missed[t]>0);
    let candidates = pool;
    if(missedTags.length && Math.random()<0.5){
      const weighted = pool.filter(q=>missedTags.includes(q.tag));
      if(weighted.length) candidates = weighted;
    }
    const q = candidates[Math.floor(Math.random()*candidates.length)];
    usedRecently.push(q); if(usedRecently.length>8) usedRecently.shift();
    return q;
  }
  function startPractice(){
    const area = root.querySelector('#quizArea');
    function paintMissedList(){
      const el = area.querySelector('#missedList'); if(!el) return;
      const tags = Object.keys(missed).filter(t=>missed[t]>0);
      el.innerHTML = tags.length ? tags.map(t=>'<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border-soft);"><span>'+t+'</span><span>&times;'+missed[t]+'</span></div>').join('') : '<p>Nada marcado todavía &mdash; sigue así.</p>';
    }
    function next(){
      const q = pickPracticeQuestion();
      area.innerHTML = '<div class="grid-2"><div class="panel quiz-card" id="pInner"></div>'
        + '<div class="panel"><h3 style="font-size:14px;">Conceptos a repasar</h3><div id="missedList" style="font-size:12.5px;color:var(--text-dim);"></div></div></div>';
      paintMissedList();
      const cb = (ok)=>{ if(!ok){ missed[q.tag]=(missed[q.tag]||0)+1; } else if(missed[q.tag]){ missed[q.tag]=Math.max(0,missed[q.tag]-1); } };
      cb.next = next;
      renderMCQ(area.querySelector('#pInner'), q, cb);
    }
    next();
  }
  function startExam(){
    const area = root.querySelector('#quizArea');
    const set = shuffle(QUESTION_BANK).slice(0, Math.min(18, QUESTION_BANK.length));
    let idx=0; const answers=[];
    function next(){
      if(idx>=set.length) return finish();
      area.innerHTML = '<div class="quiz-meta"><span>PREGUNTA '+(idx+1)+' / '+set.length+'</span><span>MODO EXAMEN</span></div>'
        + '<div class="progressline"><div class="progressline-fill" style="width:'+(idx/set.length*100)+'%"></div></div>'
        + '<div class="panel quiz-card" id="eInner"></div>';
      const q = set[idx];
      const cb = (ok)=>{ answers.push({q,ok}); };
      cb.next = ()=>{ idx++; next(); };
      renderMCQ(area.querySelector('#eInner'), q, cb);
    }
    function finish(){
      const correctCount = answers.filter(a=>a.ok).length;
      const pct = Math.round(correctCount/set.length*100);
      const wrong = answers.filter(a=>!a.ok);
      const topics = [...new Set(wrong.map(a=>a.q.tag))];
      area.innerHTML = '<div class="result-hero"><div class="result-score">'+pct+'%</div><p>'+correctCount+' / '+set.length+' correctas</p></div>'
        + (topics.length ? '<div class="panel"><h3>Temas para repasar</h3><div class="btn-row">'+topics.map(t=>chip(t)).join('')+'</div></div>' : '<div class="panel"><p>Excelente &mdash; no se detectaron temas débiles en esta ronda.</p></div>')
        + (wrong.length ? '<div class="panel" style="margin-top:16px;"><h3>Repaso</h3>'+wrong.map(a=>'<div class="review-row"><span>'+esc(a.q.stem)+'</span><span style="color:var(--bad);">Fallada</span></div><p class="side-note">'+a.q.explain+'</p>').join('')+'</div>' : '')
        + '<div class="btn-row" style="margin-top:16px;"><button class="btn primary" id="retakeBtn">REPETIR EXAMEN</button></div>';
      area.querySelector('#retakeBtn').onclick = startExam;
    }
    next();
  }
  paint();
}
/* === VIEWS_END === */

/* === INIT_START === */
const ROUTES = { home:renderHome, mri:renderMRI, hemato:renderHemato, eryth:renderEryth, rbc:renderRBC, wbc:renderWBC, mono:renderMono, apc:renderAPC, clinical:renderClinical, quiz:renderQuiz };
const CRUMB_LABELS = { home:'Inicio', mri:'Resonancia de Médula Ósea', hemato:'Hematopoyesis', eryth:'Eritropoyesis', rbc:'Fisiología del Eritrocito', wbc:'Leucocitos', mono:'Monocitos', apc:'Células Presentadoras de Antígeno', clinical:'Conexión Clínica', quiz:'Ponte a Prueba' };
function navigate(route){ location.hash = route; }
function renderRoute(){
  const r = (location.hash||'').replace('#','') || 'home';
  const fn = ROUTES[r] || renderHome;
  const app = document.getElementById('app');
  document.getElementById('crumb').textContent = CRUMB_LABELS[r] || 'Inicio';
  fn(app);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', renderRoute);
renderRoute();
/* === INIT_END === */
</script>
